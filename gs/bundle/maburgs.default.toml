[radio]
channel = 136
width   = 20
tx_card = -1               # -1 = auto-select the best-SNR card

# Boot-time channel scan: while waiting for the drone the spare card measures
# these plus `channel` (home) and the DISC proposes the least busy one. The
# pick freezes at the first DISC_ACK; a GS restart is the only re-scan.
# One card: the same card alternates home windows and dwells.
# Candidates = one escape per 5 GHz block that is not home (136 sits in
# 132-144): 120 (UNII-2e, DFS, APs avoid it), 149 (calibrated walls exist),
# 165 (20 MHz-only top of UNII-3). Each one costs ~280 ms per scan round.
[radio.scan]
enable           = true
candidates       = [120, 149, 165]
dwell_ms         = 250
settle_ms        = 30
min_rounds       = 3
home_window_ms   = 300
split_after_ms   = 5000     # after link loss, beacon on the op channel this long, then also on home
home_margin      = 20       # leave home only if a candidate's worst visit is >= 20 busy units lower

# No [[radio.cards]]: maburgs probes the USB bus at startup and uses every
# supported card it finds (chip-id, not PID -- see card_scan.h). Adding
# explicit [[radio.cards]] blocks pins exactly that set AND skips the probe;
# that is how you fly one card without unplugging an antenna. Absence is the
# knob here, so this stays commented out.
#[[radio.cards]]
#usb_vid = 3034   # decimal: the TOML subset rejects hex
#usb_pid = 0
#index   = 0

[fec]
symbol_size = 332          # must match the drone
seq_horizon = 512

[link]
vtx_id                 = 1
feedback_ms            = 50
rcf_slot_hold_ms       = 30   # hold each RCF for the next AU; 0 disables
beacon_keepalive_ms    = 1000
static_mcs             = -1   # -1 = adaptive ladder
max_mcs                = 5    # mcs5 is unholdable at range; 5 is the reach ceiling
down_util              = 0.35
up_util                = 0.15
confirm_ms             = 250
clean_ms               = 3000
probation_ms           = 3000
penalty_base_ms        = 5000
penalty_max_ms         = 10000
hold_after_down_ms     = 0
min_between_changes_ms = 150
feedback_timeout_ms    = 1000
starved_confirm_ms     = 300
s3_demote              = true
s3_down_util           = 0.15
s3_min_syms            = 50   # below this many expected symbols = no traffic
s3_settle_ms           = 300
static_overhead_base   = 0.5  # static_mcs mode only
static_overhead_enh    = 0.5

# Ladder rungs, low to high. base overhead must stay >= enh overhead.

[[link.ladder]]
mcs = 0
overhead_base = 1.0
overhead_enh  = 0.5

[[link.ladder]]
mcs = 1
overhead_base = 1.0
overhead_enh  = 0.5

[[link.ladder]]
mcs = 2
overhead_base = 1.0
overhead_enh  = 0.5

[[link.ladder]]
mcs = 3
overhead_base = 1.0
overhead_enh  = 0.5

[[link.ladder]]
mcs = 4
overhead_base = 1.0
overhead_enh  = 0.5

[[link.ladder]]
mcs = 5
overhead_base = 1.0
overhead_enh  = 0.5

# Tier 1 (docs/link-adaptation-v2-proposal.md): FEC overhead sized to the
# loss actually being measured, instead of pinned to each rung's constant.
# DISABLED here on purpose -- with enable = false the policy still computes
# and exports its target (link.ctl.ov_target_base/enh), so a flight records
# what it WOULD have commanded and can be judged against what the fixed
# 1.0/0.5 pair actually did. Arm it only after that comparison, and gate the
# arming on tools/bench/aucadence.py: this moves UEP overhead and the bitrate
# policy, which is exactly what that gate covers.
[link.overhead]
enable          = false
margin          = 2.0    # budget = margin * measured pre-FEC loss
step            = 0.1    # quantisation of the commanded value
min_ov          = 0.5    # floor: measured, = fec.log ov_req max 0.46 at rung 5
                         # (the target tracks MEAN loss, not burst structure)
max_ov          = 2.0    # ceiling of link.ladder[].overhead_*'s own range
min_interval_ms = 2000   # each change costs a keyframe on Star6E
dead_band       = 0.15   # ...so a smaller move is not worth one

# Tier 2 (docs/link-adaptation-v2-proposal.md): choose the rung by
# maximising rate*(1-margin*L) rather than by tripping a loss threshold,
# measuring the rung below with a down probe armed only when a demote could
# actually win. DISABLED here. With enable = true / act = false the probe
# arms and link.ctl.objective.{hi,lo} record the verdict without acting --
# that stage costs real airtime (a down probe is 2-3x the up probe's, since
# a fixed-size body at a lower rate is longer on air), so fly it knowingly.
# act = true is REJECTED at load today: arming and scoring are wired, the
# ladder decision is not.
[link.objective]
enable        = false
act           = false
margin        = 2.0   # must equal link.overhead.margin when both are on
demote_margin = 0.10  # the lower rung must win by this before it is worth an IDR
disarm_frac   = 0.75  # hysteresis, as a fraction of the arm threshold

# Drone-initiated rate changes (FollowCfg, gs/src/ladder_controller.h). The
# drone can drop its own rate -- apply_max_range() alone makes the pair
# disagree -- and the GS must score loss against the rung the drone is REALLY
# on, or every fade reads as worse than it is. That half is on.
#
# The FAST RESTORE is off. After an adopt, the ordinary ladder climbs back
# through the probe gate at ~3.1 s/rung, so 9-15 s from the floor -- slower
# than the obstruction dips it is recovering from. `restore = true` jumps
# straight back to the pre-adopt rung on a short clean window instead.
# It is off because proposal §9.3's restore -> re-dip cycling has no flight
# data behind it. link.ctl.restore_target is exported either way, so fly it
# off first and compare the armed target against how long the ladder actually
# took to climb back (flightreport's `fast restore:` line does this).
#
# restore_trial_ms is the cycling guard, not tuning: if the drone pulls the
# GS back off a restored rung inside it, the restore FAILED and that rung
# goes on the penalty ledger, whose existing exponential backoff then spaces
# the retries. Measured on the host fixture: without it, a drone parked on
# its own floor and a clean `u` cycle every restore_clean_ms forever -- 31
# restores in 20 s, one keyframe each. With it, 3.
[link.follow]
enable            = true
confirm_samples   = 3
lag_tail_ms       = 120   # ignore the RCF round trip, not a drone decision
restore           = false
restore_clean_ms  = 500   # shorter than link.clean_ms on purpose: the rung
                          # being restored to is one the link already held
restore_trial_ms  = 3000  # mirrors probation_ms; must be >= restore_clean_ms

[link.probe]
enable      = true
rung_offset = 1
max_util    = 0.15         # 0.15 = zero loss allowed; 0.2 allows one lost body
clean_ms    = 3000
min_syms    = 40
silence_ms  = 500
pin_mcs     = -1

[link.fade]
cascade    = true
predict    = true
hold_ms    = 2500
confirm_ms = 100
rssi_db    = 14.0
snr_db     = 6.0
trigger_ms = 300
min_rung   = 2

[link.rung_stats]
half_life_samples = 600

[video]
frame_gap_timeout_ms     = 50
frame_gap_timeout_max_ms = 100
frame_lookahead          = 8

[msp]
enable      = true
symbol_size = 1312
window      = 16

[msp.out]
host = "127.0.0.1"
port = 14560

[stats]
enable      = true
interval_ms = 200

[[stats.out]]
host = "127.0.0.1"
port = 8300                # maburtop

[[stats.out]]
host = "127.0.0.1"
port = 8302                # player GS-OSD

[au_ring]
enable     = true
path       = "/dev/shm/mabur-au"
socket     = "/run/mabur-au.sock"
slot_kb    = 512
slot_count = 16

[debug_log]
enable        = false
dir           = "/media/dvr/log"
ctl_period_ms = 50
rung_period_s = 10

# In-flight channel hop (spec 2026-09-14-inflight-channel-hop). enable=false:
# first flights observe-only; flip `enable` after the HOP section of
# flightreport looks sane.
[hop]
enable               = false
scout_when_disabled  = true
window_ms            = 150
persist              = 2
dwell_observe_ms     = 5
dwell_period_ms      = 333
rank_visits          = 5
rank_max_age_ms      = 10000
confirm_ms           = 500
verify_ms            = 1000
cooldown_ms          = 2000
max_hops_per_min     = 4
backoff_ms           = 30000
one_card_repeats     = 5

[hop.verdict]
loss_pct             = 3.0
recovered_x          = 3.0
weak_rssi_dbm        = -78
weak_snr_db          = 12
fading_drop_db       = 6
foreign_pps          = 50
fa_pps               = 100
