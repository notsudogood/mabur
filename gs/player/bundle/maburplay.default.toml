# maburplay — ground-station video player configuration (/etc/maburplay.toml)
#
# maburplay refuses to start on an unknown or misspelled key: check its log
# after editing.

ring_path   = "/dev/shm/mabur-au"   # must match maburgs' au_ring.path
socket      = "/run/mabur-au.sock"  # must match maburgs' au_ring.socket
backend     = "mpp"                 # "mpp" = hardware decode to the screen; "v4l2req" = Cedrus hardware decode (Orange Pi); "null" = decode nothing (testing)
screen_mode = "1920x1080@60"        # display resolution and refresh rate

# Video recorder (DVR).
[dvr]
autostart   = false        # true = record from the start; false = wait for the record button ([input.rec])
dir         = "/media/dvr"   # where recordings are saved
fragment_ms = 1000         # recording is saved in pieces this long, so a power cut loses at most this much
mode        = "raw"        # "raw" = video exactly as received; "burned" = re-encoded with the OSD drawn in (costs latency spikes)
osd_file    = true         # raw: also save the OSD (.osd, for walksnail-osd-tool) and link summaries (.srt for walksnail-osd-tool, .link.srt with our detail) next to the video
osd_fc      = "BTFL"       # flight controller firmware for the .osd file: "BTFL", "INAV" or "ARDU"
split_at_arm = true        # raw: start a new file (from the next keyframe, no gap) when the drone arms or disarms.
                           # Its frame rate changes there (30 fps disarmed in low power), and walksnail-osd-tool
                           # renders a whole file at the rate of its start, so each file keeps one rate
target      = "gs"         # where the record button records: "gs" = here, "vtx" = the drone's SD card, "both"

# Recording settings for mode = "burned".
[dvr.burned]
bitrate_kbps = 8000
every        = 1           # record every N-th screen refresh: 1 = the panel's rate, 2 = half of it
                           # (a 100 Hz panel needs 2: the recorder tops out below 100 fps)
size         = ""          # "WxH" picture size of the recording; "" = the size the drone sends (no scaling)

# Flight-controller OSD (from the drone, relayed by maburgs).
[osd]
enable   = true
port     = 14560           # must match maburgs' msp.out.port
font     = "/usr/local/share/mabur/font_btfl.mfont"   # OSD font file
scale    = "sharp"         # "sharp" = crisp pixels; "fill" = stretch to fill the screen
stale_ms = 5000            # hide the OSD after this long without updates; 0 = never

# Ground-station link stats drawn on screen (signal, link rate, loss).
[osd.gs]
enable   = true
port     = 8302            # must match a [[stats.out]] port in maburgs.toml
font     = "/usr/local/share/mabur/gs_osd.gfont"      # stats font file
stale_ms = 3000            # dim the stats after this long without updates

# GPIO record button: toggles the DVR. Delete this whole block if no button
# is wired; the DVR then records only with dvr.autostart = true.
[input.rec]
pin        = 32            # pin number on the 40-pin header
active_low = true          # button connects the pin to GND
bias       = "pull-up"     # "pull-up" | "pull-down" | "none" (as the board set it) | "disable"

# On-screen menu on the 5-way stick: press the centre to open it. Channel hop on/off, the
# channel to stay on, Bandwidth Normal/Wide; Apply restarts the link (~5 s). Pins are the
# RunCam WiFiLink's (as PixelPilot uses them). Delete this section for no menu.
[input.menu]
up         = 16
down       = 18
left       = 13
right      = 38
center     = 11
active_low = false         # the stick pulls the pin high when pressed
bias       = "none"        # leave the pin's pull as the board set it, as PixelPilot does
gs_config  = "/etc/maburgs.toml"   # where the menu reads the channel set from

# Frame timing: shows each frame in step with the screen's refresh for
# steady, low-latency video.
[display]
regulate_ms   = 12         # fallback delay before showing a frame, used until refresh timing is learned
vsync_lock    = true       # time frames to the screen refresh
vsync_lead_ms = 5          # hand a frame to the display this long before the refresh
chain_budget  = 0          # 0 = never drop a frame to cut a one-refresh-late run (smooth; the run ends on its own);
                           # N = drop one after N such frames to regain the refresh (lower latency, visible drops)
sched_cap_ms  = 16         # a frame may arrive up to this many ms late and keep its capture-time slot; 0 = time frames by arrival; with phase_lock on, capture-time placement itself runs only while the lock holds
phase_lock    = true       # steer the drone camera's frame rate so frames land a fixed margin before the screen refresh (flat latency, no judder)
phase_margin_ms = 4        # that margin, ms: smaller is lower latency but less room for late frames
rt_priority = 10  # SCHED_FIFO priority of the release thread; 0 = ordinary scheduling

# Undo the drone camera's colour tuning (the "colortrans" sensor file in the
# drone's venc.sensor_bin) on the screen, the OSD and the recording.
[colortrans]
enable = true

# Video decoder.
[decoder]
stream = true              # start decoding a picture slice by slice as it arrives (needs a GS image whose decoder streams: the Radxa stream-mode image, or the Orange Pi image's patched libavcodec); false = decode whole pictures
